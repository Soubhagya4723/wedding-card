<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a582f"/>
      <stop offset="100%" stop-color="#2b331f"/>
    </linearGradient>
    <linearGradient id="goldG4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4d4"/>
      <stop offset="50%" stop-color="#f2ad8c"/>
      <stop offset="100%" stop-color="#d4825d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="12" fill="url(#gBg4)"/>
  <rect x="18" y="18" width="564" height="414" rx="8" fill="none" stroke="url(#goldG4)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Musical Instruments & Floating Musical Notes -->
  <g transform="translate(300, 220)">
    <circle r="95" fill="url(#goldG4)" opacity="0.08"/>
    <!-- Royal Dhol Drum -->
    <g transform="rotate(-15)">
      <ellipse cx="0" cy="15" rx="75" ry="42" fill="#782312" stroke="url(#goldG4)" stroke-width="3"/>
      <ellipse cx="-75" cy="15" rx="14" ry="40" fill="#f8e5b9" stroke="url(#goldG4)" stroke-width="2"/>
      <ellipse cx="75" cy="15" rx="14" ry="40" fill="#f8e5b9" stroke="url(#goldG4)" stroke-width="2"/>
      <!-- Drum ropes -->
      <line x1="-75" y1="15" x2="0" y2="-20" stroke="url(#goldG4)" stroke-width="1.8"/>
      <line x1="0" y1="-20" x2="75" y2="15" stroke="url(#goldG4)" stroke-width="1.8"/>
      <line x1="-75" y1="15" x2="0" y2="50" stroke="url(#goldG4)" stroke-width="1.8"/>
      <line x1="0" y1="50" x2="75" y2="15" stroke="url(#goldG4)" stroke-width="1.8"/>
    </g>
    <!-- Musical notes rising -->
    <g stroke="url(#goldG4)" stroke-width="2.5" fill="none">
      <path d="M-80,-40 L-80,-75 L-45,-85 L-45,-50 M-80,-65 L-45,-75"/>
      <circle cx="-83" cy="-38" r="7" fill="url(#goldG4)"/>
      <circle cx="-48" cy="-48" r="7" fill="url(#goldG4)"/>

      <path d="M50,-50 L50,-85 L85,-95 L85,-60 M50,-75 L85,-85"/>
      <circle cx="47" cy="-48" r="7" fill="url(#goldG4)"/>
      <circle cx="82" cy="-58" r="7" fill="url(#goldG4)"/>
    </g>
  </g>
</svg>