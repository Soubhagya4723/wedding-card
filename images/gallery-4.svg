  </defs>
  <rect width="600" height="450" rx="12" fill="url(#gBg3)"/>
  <rect x="18" y="18" width="564" height="414" rx="8" fill="none" stroke="url(#goldG3)" stroke-width="1.5" stroke-dasharray="6,4"/>
