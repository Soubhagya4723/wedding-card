<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a582f"/>
      <stop offset="100%" stop-color="#2b331f"/>
    </linearGradient>
    <linearGradient id="goldG0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4d4"/>
      <stop offset="50%" stop-color="#f2ad8c"/>
      <stop offset="100%" stop-color="#d4825d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="12" fill="url(#gBg0)"/>
  <rect x="18" y="18" width="564" height="414" rx="8" fill="none" stroke="url(#goldG0)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Starlight night sky -->
  <g fill="#ffe4d4" opacity="0.6">
    <circle cx="120" cy="80" r="2"/><circle cx="210" cy="140" r="1.5"/><circle cx="480" cy="90" r="2.5"/><circle cx="390" cy="70" r="2"/>
    <circle cx="150" cy="220" r="1.5"/><circle cx="450" cy="200" r="1.8"/>
  </g>
  <!-- Diamond Ring Silhouette -->
  <g transform="translate(300, 220)">
    <circle r="95" fill="url(#goldG0)" opacity="0.08"/>
    <!-- Intertwined Rings -->
    <circle cx="-30" cy="10" r="60" fill="none" stroke="url(#goldG0)" stroke-width="8"/>
    <circle cx="30" cy="10" r="60" fill="none" stroke="url(#goldG0)" stroke-width="8"/>
    <!-- Diamond Sparkle -->
    <polygon points="30,-58 45,-80 15,-80" fill="#fffde6" stroke="url(#goldG0)" stroke-width="2"/>
    <circle cx="30" cy="-68" r="6" fill="#ffffff" filter="drop-shadow(0 0 8px #f5bc9f)"/>
    <!-- Heart in center -->
    <path d="M0,0 C-10,-20 -30,-5 0,25 C30,-5 10,-20 0,0 Z" fill="#e8875f"/>
  </g>
</svg>